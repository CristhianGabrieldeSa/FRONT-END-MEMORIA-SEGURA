<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Sistema de Apoio</title>

    <link rel="stylesheet" href="auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <main class="auth-container">

        <section class="auth-card cadastro-card">

            <div class="auth-logo">

                <img src="img/logotipo.png" alt="Sistema de Apoio">

                <h1>Sistema de Apoio</h1>

                <p>Cuidado que conecta</p>

            </div>

            <div class="auth-header">

                <h2>Criar sua conta</h2>

                <p>
                    Preencha os dados para começar.
                </p>

            </div>

            <form id="formCadastro">

                <div class="auth-field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input type="text" id="nome" placeholder="Digite seu nome" required>

                    </div>

                </div>

                <div class="auth-field">

                    <label for="emailCadastro">
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="emailCadastro" placeholder="Digite seu e-mail" required>

                    </div>

                </div>

                <div class="auth-field">

                    <label for="senhaCadastro">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="senhaCadastro" placeholder="Crie uma senha" required>

                    </div>

                </div>

                <div class="auth-field">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>

                    </div>

                </div>

                <div class="auth-field">

                    <label for="perfilCadastro">Perfil</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user-shield"></i>

                        <select id="perfilCadastro" required>
                            <option value="cuidador">Cuidador</option>
                            <option value="familiar">Familiar</option>
                            <option value="administrador">Administrador</option>
                            <option value="paciente">Paciente</option>
                        </select>

                    </div>

                </div>

                <div id="mensagemCadastro" class="auth-mensagem">
                </div>

                <button type="submit" class="btn-auth">

                    <i class="fa-solid fa-user-plus"></i>

                    Criar conta

                </button>

            </form>

            <div class="auth-cadastro">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Voltar para o login
                </a>

            </div>

        </section>

    </main>

    <script src="auth.js"></script>

</body>

</html>
