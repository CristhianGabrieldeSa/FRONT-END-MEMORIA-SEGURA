<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel do Sistema</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>

<body>
    <!--***************************BARRA DE NAVEGAÇÃO NA LATERAL: INÍCIO***************************-->
    <div class="container">
        <aside class="sidebar">
            <div class="logo-container">
                <img class="logo" src="../../img/logotipo.png">
                <div class="logo-text">
                    <h2>Sistema de Apoio</h2>
                    <span>Cuidado que conecta</span>
                </div>
            </div>
            <nav>
                <a href="../index.html"><i class="fa-solid fa-house"></i>Dashboard</a>
                <a href="../paginas/usuario.html"><i class="fa-solid fa-users"></i>Usuários</a>
                <a href="../paginas/medicamentos.html"><i class="fa-solid fa-pills"></i>Medicamentos</a>
                <a href="../paginas/rotina.html"><i class="fa-solid fa-calendar-days"></i>Rotina</a>
                <a href="../paginas/ocorrencias.html"><i class="fa-solid fa-triangle-exclamation"></i>Ocorrências</a>
                <a href="../paginas/alertas.html" class="active"><i class="fa-solid fa-bell"></i>Alertas</a>
                <a href="../paginas/comunicacao.html"><i class="fa-solid fa-comment"></i>Comunicação</a>
            </nav>
        </aside>
        <!--***************************BARRA DE NAVEGAÇÃO NA LATERAL: FINAL***************************-->

        <!-- ***************************COLUNAS SUPERIOR NA HORIZONTAL: INÍCIO*************************** -->
        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Alertas</h1>
                    <p>Veja os avisos mais urgentes e as pendências do dia.</p>
                </div>
               <div class="data-atual">
                    <i class="fa-regular fa-calendar"></i>
                    <span id="dataAtual"></span>
                </div>
            </header>
            <section class="module-card">
                <div class="module-header">
                    <div class="module-title-wrap">
                        <div class="icon-box module-icon">
                            <i class="fa-solid fa-bell"></i>
                        </div>
                        <div>
                            <h3>Prioridades do dia</h3>
                            <p>Itens que necessitam atenção imediata</p>
                        </div>
                    </div>
                    <span class="pill warning" id="contadorAlertas">0 alertas</span>
                </div>

                <ul class="module-list" id="listaAlertas"></ul>
            </section>


        </main>
    </div>
    <script src="../../script.js"></script>
    <script src="../../protecao.js"></script>
</body>

</html>
