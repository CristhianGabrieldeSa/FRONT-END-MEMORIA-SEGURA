<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso - Sistema de Apoio</title>

    <link rel="stylesheet" href="./auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="pagina-login">

    <main class="auth-container">

        <section class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">

                <img src="img/logotipo.png" alt="Sistema de Apoio">

                <h1>Sistema de Apoio</h1>

                <p>Cuidado que conecta</p>

            </div>


            <!-- CABEÇALHO -->
            <div class="auth-header">

                <h2>Bem-vindo(a)!</h2>

                <p>
                    Entre na sua conta para continuar.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form id="formLogin">


                <!-- E-MAIL -->
                <div class="auth-field">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- SENHA -->
                <div class="auth-field">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                            autocomplete="current-password" required>

                        <button type="button" class="mostrar-senha" id="mostrarSenha" aria-label="Mostrar senha">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- MENSAGEM -->
                <div id="mensagemLogin" class="auth-mensagem"></div>


                <!-- BOTÃO -->
                <button type="submit" class="btn-auth">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Entrar

                </button>

            </form>


            <!-- CADASTRO -->
            <div class="auth-cadastro">

                <p>
                    Ainda não possui uma conta?

                    <a href="#" id="linkCadastro">
                        Criar conta
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="auth.js"></script>

</body>

</html>
